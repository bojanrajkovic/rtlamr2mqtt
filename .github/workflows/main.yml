name: "Docker build"

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Manual trigger"
  push:
    paths-ignore:
      - "**.md"
      - "**.json"
      - "**.yaml"
      - "LICENSE"
      - "examples/**"
    branches:
      - main
      - dev
      - async
    tags:
      - "*.*.*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.json"
      - "**.yaml"
      - "LICENSE"
      - "examples/**"
    branches:
      - main
      - dev
      - async

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

env:
  IMAGE_NAME: rtlamr2mqtt

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: rtlamr2mqtt-addon
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: rtlamr2mqtt-addon
        run: pytest -v

  release:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          # Release tags look like 2026.11.8-br.1: the upstream version this fork is based on, then
          # the fork's build number.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: rtlamr2mqtt-addon/
          # The only consumer runs on amd64; QEMU builds for other platforms take most of the job.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
